<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF640A">
  <meta name="description" content="Join ANIME.PLUS - Stream popular anime, simulcasts, and movies online in HD.">
  <title>Join ANIME.PLUS — Create Account</title>

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ANIME.PLUS">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-background"></div>

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="auth-logo">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        <span class="brand-text">
          <span class="brand-anime">ANIME</span><span class="brand-dot">.</span><span class="brand-plus">PLUS</span>
        </span>
      </a>
      <h2>Create Your Account</h2>
      <p class="subtitle">Join millions of anime fans worldwide</p>
    </div>

    <form id="registerForm" class="auth-form">
      <div class="form-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" placeholder="e.g. Sung Jinwoo" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="regDob">Date of Birth</label>
        <input type="date" id="regDob" required max="2020-01-01">
      </div>

      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="regPhone">Mobile Number (For OTP Verification)</label>
        <div class="phone-input-wrapper">
          <div class="phone-prefix-select">
            <select id="regCountryCodeSelect" class="country-select-clean">
              <option value="+91" selected>+91 IN</option>
              <option value="+1">+1 US</option>
              <option value="+81">+81 JP</option>
              <option value="+44">+44 UK</option>
              <option value="+49">+49 DE</option>
              <option value="+61">+61 AU</option>
            </select>
          </div>
          <div class="phone-number-field">
            <input type="tel" id="regPhone" placeholder="98765 43210" autocomplete="tel">
            <span class="phone-field-icon">📱</span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="regPassword">Password (Min 6 chars)</label>
        <div class="password-input-wrapper">
          <input type="password" id="regPassword" placeholder="••••••••" required minlength="6" autocomplete="new-password">
          <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="regConfirmPassword">Confirm Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="regConfirmPassword" placeholder="••••••••" required minlength="6" autocomplete="new-password">
          <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="auth-button">
        CREATE ANIME.PLUS ACCOUNT
      </button>
    </form>

    <div class="auth-divider">OR</div>

    <button type="button" class="google-signin-btn" id="googleRegisterBtn">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Sign Up with Google Account
    </button>

    <div class="auth-switch-text">
      Already have an account? <a href="login.html">Sign In with OTP / Password</a>
    </div>

    <a href="index.html" class="home-back-link">
      ← Back to ANIME.PLUS Home
    </a>
  </div>
</div>

<!-- Scripts -->
<script src="js/anime-data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
