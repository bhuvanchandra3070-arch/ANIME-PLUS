<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF640A">
  <title>Reset Password — ANIME.PLUS</title>

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ANIME.PLUS">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-background"></div>

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="auth-logo">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        <span class="brand-text">
          <span class="brand-anime">ANIME</span><span class="brand-dot">.</span><span class="brand-plus">PLUS</span>
        </span>
      </a>
      <h2>Reset Your Password</h2>
      <p class="subtitle">Enter your registered email or mobile to receive an OTP reset code.</p>
    </div>

    <form id="forgotPasswordForm" class="auth-form" onsubmit="event.preventDefault();">
      <!-- Target Input -->
      <div class="form-group">
        <label for="resetTargetInput">Email or Mobile Number</label>
        <input type="text" id="resetTargetInput" placeholder="name@example.com / +91 9876543210" required>
      </div>

      <button type="button" class="auth-button" id="sendResetOtpBtn">
        SEND RESET CODE
      </button>

      <!-- OTP Step (revealed after send) -->
      <div id="resetOtpStep" class="otp-box-step hidden">
        <div class="otp-verify-info" style="margin-top: 1rem;">
          Enter the 6-digit reset code sent to your account
        </div>

        <div class="otp-digits-container" id="resetOtpDigits">
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code">
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric">
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric">
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric">
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric">
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric">
        </div>

        <div class="otp-timer-row">
          <span id="resetOtpTimer">Resend code in 60s</span>
          <button type="button" class="resend-otp-btn" id="resendResetOtpBtn" disabled>
            Resend Code
          </button>
        </div>
      </div>

      <!-- New Password Step (revealed along with OTP) -->
      <div id="newPasswordStep" class="hidden" style="margin-top: 1rem;">
        <div class="form-group">
          <label for="newPasswordInput">New Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="newPasswordInput" placeholder="Min 6 characters">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group" style="margin-top: 1rem;">
          <label for="confirmNewPasswordInput">Confirm New Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="confirmNewPasswordInput" placeholder="Re-enter password">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="button" class="auth-button" id="submitNewPasswordBtn" style="margin-top: 1.25rem;">
          SET NEW PASSWORD & LOGIN
        </button>
      </div>
    </form>

    <div class="auth-switch-text">
      Remembered your password? <a href="login.html">Sign In</a>
    </div>

    <a href="index.html" class="home-back-link">
      ← Back to ANIME.PLUS Home
    </a>
  </div>
</div>

<!-- Scripts -->
<script src="js/anime-data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
